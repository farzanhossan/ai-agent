version: '3.9'

services:
  ${DOCKER_SERVICE_NAME}:
    container_name: ${DOCKER_SERVICE_NAME}
    image: farzanhossan/${DOCKER_SERVICE_NAME}:latest
    ports:
      - '${PORT}:${PORT}'
    volumes:
      - '/var/www/uploads:/uploads'
      - './logs:/app/logs'
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
    restart: always
    networks:
      - bp-net

networks:
  bp-net:
    driver: bridge
