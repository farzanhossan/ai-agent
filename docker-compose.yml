version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Separate service to pull models
  ollama-pull:
    image: ollama/ollama:latest
    container_name: ollama-pull
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sleep 10
        ollama pull llama2
        ollama pull llama3 # Optional: pull more models
        echo "✅ Models ready!"
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data:
# Start everything (pulls model automatically)
# docker-compose up -d

# Check logs
# docker-compose logs -f ollama-pull

# Verify model is downloaded
# docker exec ollama ollama list
